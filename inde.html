<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Java AWT Compiler</title>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#eee;font-family:system-ui,Arial,sans-serif;height:100vh;display:flex;flex-direction:column}header{padding:12px 14px;border-bottom:1px solid #2b2f38;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:18px;margin:0;font-weight:650}.hint{font-size:12px;color:#9aa2b1}main{display:flex;flex:1;min-height:0;flex-direction:column}.toolbar{display:flex;gap:8px;padding:10px;border-bottom:1px solid #2b2f38;flex-wrap:wrap}button{border:0;border-radius:8px;padding:10px 14px;font-weight:650;cursor:pointer;background:#2563eb;color:#fff}button.secondary{background:#2a2f3a}button.danger{background:#b42318}button:disabled{opacity:.5;cursor:not-allowed}.editor-wrap{flex:1;min-height:0;display:flex}.line{width:42px;background:#151820;color:#667085;padding:12px 6px;text-align:right;font:14px/1.5 monospace;overflow:hidden;user-select:none}.editor{flex:1;border:0;outline:0;resize:none;background:#0b0d11;color:#e6edf3;padding:12px;font:14px/1.5 monospace;tab-size:4}.status{min-height:44px;padding:10px 12px;background:#151820;border-top:1px solid #2b2f38;font-size:13px;color:#b9c0cc}.display{position:relative;min-height:0;height:0;overflow:hidden;background:#ddd}.display.on{height:55vh;min-height:360px;border-top:1px solid #2b2f38}#cjdisplay{width:100%;height:100%}@media(min-width:800px){main{flex-direction:row}.editor-wrap{width:55%;height:auto}.display{height:auto;flex:1}.display.on{height:auto;min-height:0;border-top:0;border-left:1px solid #2b2f38}}
</style>
</head>
<body>
<header><h1>Java AWT Compiler</h1><span class="hint">Write your own Java code • Compile • Run AWT/Swing in the browser</span></header>
<div class="toolbar">
<button id="run">▶ Compile &amp; Run</button><button id="clear" class="secondary">Clear</button><button id="example" class="secondary">Insert Example</button><button id="hide" class="secondary">Hide Output</button>
</div>
<main>
<div class="editor-wrap"><div class="line" id="lines">1</div><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Java source"></textarea></div>
<div class="display" id="display"><div id="cjdisplay"></div></div>
</main>
<div class="status" id="status">Ready. Enter your Java program. Your class must contain a static main method.</div>
<script>
const code=document.getElementById('code'), lines=document.getElementById('lines'), status=document.getElementById('status'), display=document.getElementById('display');
const example=`import java.awt.*;\n\nclass HelloAWT extends Frame {\n    HelloAWT() {\n        setTitle("My AWT App");\n        setSize(400, 250);\n        setLayout(new FlowLayout());\n        add(new Label("Hello from Java AWT!"));\n        setVisible(true);\n    }\n\n    public static void main(String args[]) {\n        new HelloAWT();\n    }\n}`;
code.value='';
function updateLines(){let n=code.value.split('\n').length;lines.textContent=Array.from({length:n},(_,i)=>i+1).join('\n')}code.addEventListener('input',updateLines);code.addEventListener('scroll',()=>lines.scrollTop=code.scrollTop);updateLines();
let initialized=false, ecjReady=false;
async function init(){if(!initialized){status.textContent='Starting Java runtime…';await cheerpjInit();initialized=true;}}
async function loadCompiler(){if(ecjReady)return;status.textContent='Loading Java compiler…';const u='https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/3.37.0/ecj-3.37.0.jar';const r=await fetch(u);if(!r.ok)throw new Error('Could not download the compiler.');const b=new Uint8Array(await r.arrayBuffer());cheerpOSAddStringFile('/str/ecj.jar',b);ecjReady=true;}
function findMainClass(src){let m=src.match(/(?:class|public\s+class|final\s+class)\s+([A-Za-z_$][\w$]*)/);return m?m[1]:null}
async function run(){const src=code.value;if(!src.trim()){status.textContent='Write some Java code first.';return}document.getElementById('run').disabled=true;try{await init();await loadCompiler();const cls=findMainClass(src);if(!cls)throw new Error('Could not find a class name.');cheerpOSAddStringFile('/str/'+cls+'.java',src);status.textContent='Compiling '+cls+'…';display.classList.add('on');document.getElementById('cjdisplay').innerHTML='';
// ECJ standalone compiler. Output classes go to CheerpJ persistent virtual storage.
await cheerpjRunMain('org.eclipse.jdt.internal.compiler.batch.Main','/str/ecj.jar','-1.8','-proc:none','-d','/files/classes','/str/'+cls+'.java');
status.textContent='Running '+cls+'…';await cheerpjRunMain(cls,'/files/classes');status.textContent='Program started. If it creates an AWT/Swing window, it appears in the output area.';
}catch(e){console.error(e);status.textContent='Error: '+(e?.message||e)+' — see browser console for compiler details.'}finally{document.getElementById('run').disabled=false}}
document.getElementById('run').onclick=run;document.getElementById('clear').onclick=()=>{code.value='';updateLines();status.textContent='Editor cleared.'};document.getElementById('example').onclick=()=>{code.value=example;updateLines();status.textContent='Example inserted. Edit it or replace it with your own program.'};document.getElementById('hide').onclick=()=>display.classList.toggle('on');
</script>
</body></html>
