<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Java AWT Mobile Compiler</title>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#eee;font-family:system-ui,Arial,sans-serif;height:100vh;display:flex;flex-direction:column}header{padding:12px 14px;border-bottom:1px solid #2b2f38}h1{font-size:19px;margin:0 0 3px}.hint{font-size:12px;color:#9aa2b1}.toolbar{display:flex;gap:8px;padding:10px;border-bottom:1px solid #2b2f38;flex-wrap:wrap}button{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer;background:#2563eb;color:white}button.secondary{background:#2a2f3a}button:disabled{opacity:.5}.main{display:flex;flex:1;min-height:0;flex-direction:column}.editor-wrap{display:flex;flex:1;min-height:280px}.line{width:43px;background:#151820;color:#667085;padding:12px 6px;text-align:right;font:14px/1.5 monospace;overflow:hidden;user-select:none}.editor{flex:1;border:0;outline:0;resize:none;background:#0b0d11;color:#e6edf3;padding:12px;font:14px/1.5 monospace;tab-size:4}.status{min-height:45px;padding:10px 12px;background:#151820;border-top:1px solid #2b2f38;font-size:13px;color:#c4cad5}.display{height:0;overflow:auto;background:#ddd}.display.on{height:52vh;min-height:340px;border-top:1px solid #2b2f38}#cjdisplay{min-height:100%;width:100%}@media(min-width:850px){.main{flex-direction:row}.editor-wrap{width:55%;height:auto}.display{height:auto;flex:1}.display.on{height:auto;border-top:0;border-left:1px solid #2b2f38}}
</style>
</head>
<body>
<header><h1>Java AWT Mobile Compiler</h1><div class="hint">Write your own Java code • Compile • Run • AWT/Swing output</div></header>
<div class="toolbar">
<button id="run">▶ Compile &amp; Run</button>
<button id="clear" class="secondary">Clear</button>
<button id="example" class="secondary">Insert Example</button>
<button id="hide" class="secondary">Hide Output</button>
</div>
<div class="main">
<div class="editor-wrap"><div class="line" id="lines">1</div><textarea id="code" class="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea></div>
<div class="display" id="display"><div id="cjdisplay"></div></div>
</div>
<div class="status" id="status">Ready. Enter your Java program.</div>
<script>
const code=document.getElementById('code'),lines=document.getElementById('lines'),status=document.getElementById('status'),display=document.getElementById('display'),runBtn=document.getElementById('run');
const example=`import java.awt.*;\n\nclass HelloAWT extends Frame {\n    HelloAWT() {\n        setTitle("My AWT App");\n        setSize(400, 250);\n        setLayout(new FlowLayout());\n        add(new Label("Hello from Java AWT!"));\n        setVisible(true);\n    }\n\n    public static void main(String args[]) {\n        new HelloAWT();\n    }\n}`;
function updateLines(){const n=code.value.split('\n').length;lines.textContent=Array.from({length:n},(_,i)=>i+1).join('\n')}
code.addEventListener('input',updateLines);code.addEventListener('scroll',()=>lines.scrollTop=code.scrollTop);updateLines();
let cjReady=false,displayCreated=false;
async function init(){if(cjReady)return;status.textContent='Starting Java runtime…';await cheerpjInit({status:'none'});cjReady=true;}
function findMainClass(src){let m=src.match(/\bclass\s+([A-Za-z_$][\w$]*)/);return m?m[1]:null}
function findPackage(src){let m=src.match(/\bpackage\s+([A-Za-z_$][\w$]*(?:\s*\.\s*[A-Za-z_$][\w$]*)*)\s*;/);return m?m[1].replace(/\s/g,''):''}
async function run(){const src=code.value;if(!src.trim()){status.textContent='Write some Java code first.';return}runBtn.disabled=true;try{await init();
  status.textContent='Checking Java compiler…';
  const check=await fetch('tools.jar',{method:'HEAD',cache:'no-store'});
  if(!check.ok)throw new Error('tools.jar is missing from this GitHub Pages deployment. Use the supplied GitHub Actions workflow so it downloads the compiler automatically.');
  const cls=findMainClass(src);if(!cls)throw new Error('Could not find a Java class.');
  const pkg=findPackage(src);const mainClass=pkg?pkg+'.'+cls:cls;
  cheerpOSAddStringFile('/str/'+cls+'.java',src);
  display.classList.add('on');
  const host=document.getElementById('cjdisplay');host.innerHTML='';
  if(!displayCreated){cheerpjCreateDisplay(-1,-1,host);displayCreated=true;}
  status.textContent='Compiling '+mainClass+'…';
  const compileCode=await cheerpjRunMain('com.sun.tools.javac.Main','/app/tools.jar:/files/','/str/'+cls+'.java','-d','/files/','-Xlint');
  if(compileCode!==0)throw new Error('Compilation failed. Check the Java compiler output in the AWT display.');
  status.textContent='Running '+mainClass+'…';
  const exitCode=await cheerpjRunMain(mainClass,'/app/tools.jar:/files/');
  if(exitCode!==0)throw new Error('Program exited with code '+exitCode+'.');
  status.textContent='Program finished.';
}catch(e){console.error(e);status.textContent='Error: '+(e?.message||e)}finally{runBtn.disabled=false}}
runBtn.onclick=run;
document.getElementById('clear').onclick=()=>{code.value='';updateLines();status.textContent='Editor cleared.'};
document.getElementById('example').onclick=()=>{code.value=example;updateLines();status.textContent='Example inserted.'};
document.getElementById('hide').onclick=()=>display.classList.toggle('on');
</script>
</body>
</html>
