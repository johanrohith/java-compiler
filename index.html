<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Java AWT Compiler</title>

    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background: #0f1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 16px 18px;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 1px solid #30343d;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 14px 18px;
            border-bottom: 1px solid #30343d;
        }

        /* Only style the website buttons */
        .toolbar button {
            border: none;
            border-radius: 10px;
            padding: 13px 18px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: #2b303b;
            cursor: pointer;
        }

        .toolbar button.run {
            background: #2867e8;
        }

        .toolbar button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .container {
            padding: 15px 18px 30px;
        }

        .message {
            margin-bottom: 10px;
            color: #aeb5c4;
            font-size: 14px;
        }

        /* Only style the source editor */
        #source {
            width: 100%;
            height: 55vh;
            min-height: 350px;
            resize: vertical;

            padding: 14px;

            border: none;
            border-radius: 10px;

            background: white;
            color: black;

            font-family: Consolas, "Courier New", monospace;
            font-size: 15px;
            line-height: 1.5;

            outline: none;
        }

        #status {
            margin: 12px 2px;
            min-height: 24px;
            white-space: pre-wrap;

            font-family: Consolas, "Courier New", monospace;
            color: #cbd1dc;
        }

        /*
         * Large output area for AWT applications.
         */
        #output {
            margin-top: 12px;

            border: 1px solid #30343d;
            border-radius: 12px;

            background: #161922;

            width: 100%;
            min-height: 700px;

            overflow: auto;
        }

        #console {
            padding: 12px;

            color: #dddddd;

            font-family: Consolas, "Courier New", monospace;
            white-space: pre-wrap;

            min-height: 40px;
        }

        #cheerpjDisplay {
            width: 100%;
            height: 600px;
            min-height: 600px;

            overflow: visible;
        }
    </style>
</head>

<body>

<header>
    Java AWT Compiler
</header>

<div class="toolbar">
    <button id="run" class="run">▶ Compile &amp; Run</button>
    <button id="clear">Clear</button>
    <button id="example">Insert Example</button>
    <button id="toggleOutput">Hide Output</button>
</div>

<div class="container">

    <div class="message">
        Paste your Java program below and compile it in the browser.
    </div>

    <textarea
        id="source"
        spellcheck="false"
        placeholder="Paste Java code here..."
    ></textarea>

    <div id="status">Ready.</div>

    <div id="output">
        <div id="console"></div>
        <div id="cheerpjDisplay"></div>
    </div>

</div>

<script type="module">

    const source = document.getElementById("source");
    const status = document.getElementById("status");
    const consoleBox = document.getElementById("console");
    const output = document.getElementById("output");

    const runButton = document.getElementById("run");
    const clearButton = document.getElementById("clear");
    const exampleButton = document.getElementById("example");
    const toggleOutputButton =
        document.getElementById("toggleOutput");

    let cheerpjReady = false;


    /*
     * Example AWT program
     */
    const exampleCode = `import java.awt.*;
import java.awt.event.*;

class HelloAWT extends Frame {

    HelloAWT() {
        setTitle("Hello AWT");
        setSize(400, 250);
        setLayout(new FlowLayout());

        add(new Label("Hello from Java AWT!"));

        setVisible(true);
    }

    public static void main(String args[]) {
        new HelloAWT();
    }
}`;


    /*
     * Insert Example
     */
    exampleButton.addEventListener("click", () => {

        source.value = exampleCode;

        status.textContent = "Example inserted.";
    });


    /*
     * Clear editor and console
     */
    clearButton.addEventListener("click", () => {

        source.value = "";
        consoleBox.textContent = "";
        status.textContent = "Ready.";
    });


    /*
     * Show / Hide output
     */
    toggleOutputButton.addEventListener("click", () => {

        if (output.style.display === "none") {

            output.style.display = "block";
            toggleOutputButton.textContent = "Hide Output";

        } else {

            output.style.display = "none";
            toggleOutputButton.textContent = "Show Output";
        }
    });


    /*
     * Find the main class
     */
    function findMainClass(code) {

        const packageMatch = code.match(
            /\bpackage\s+([A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*)\s*;/
        );

        let classMatch = code.match(
            /\bpublic\s+class\s+([A-Za-z_$][\w$]*)/
        );

        if (!classMatch) {

            classMatch = code.match(
                /\bclass\s+([A-Za-z_$][\w$]*)/
            );
        }

        if (!classMatch) {
            throw new Error("No class declaration found.");
        }

        const className = classMatch[1];

        if (packageMatch) {
            return packageMatch[1] + "." + className;
        }

        return className;
    }


    /*
     * Initialize CheerpJ
     */
    async function initializeCheerpJ() {

        if (cheerpjReady) {
            return;
        }

        status.textContent =
            "Starting Java runtime...";

        await cheerpjInit({
            status: "none"
        });

        cheerpjCreateDisplay(
            -1,
            -1,
            document.getElementById("cheerpjDisplay")
        );

        cheerpjReady = true;
    }


    /*
     * Compile and Run
     */
    async function compileAndRun() {

        runButton.disabled = true;

        consoleBox.textContent = "";
        status.textContent = "Starting...";

        try {

            const code = source.value.trim();

            if (!code) {
                throw new Error("The editor is empty.");
            }

            await initializeCheerpJ();

            const mainClass = findMainClass(code);

            const simpleClassName =
                mainClass.split(".").pop();

            /*
             * Place source in CheerpJ /str/ filesystem.
             */
            const sourceFile =
                "/str/" + simpleClassName + ".java";

            cheerpOSAddStringFile(
                sourceFile,
                new TextEncoder().encode(code)
            );


            /*
             * IMPORTANT:
             * This is your working tools.jar path.
             */
            const classPath =
                "/app/java-compiler/tools.jar:/files/";


            status.textContent =
                "Compiling " +
                simpleClassName +
                "...";


            /*
             * Run javac.
             */
            const compileResult =
                await cheerpjRunMain(
                    "com.sun.tools.javac.Main",
                    classPath,
                    sourceFile,
                    "-d",
                    "/files/"
                );


            if (Number(compileResult) !== 0) {

                status.textContent =
                    "Compilation failed. See the output above.";

                return;
            }


            /*
             * Run the compiled Java program.
             */
            status.textContent =
                "Running " +
                mainClass +
                "...";


            /*
             * Start the Java application.
             */
            const runResult =
                await cheerpjRunMain(
                    mainClass,
                    classPath
                );


            status.textContent =
                "Program finished. Exit code: " +
                runResult;

        } catch (error) {

            consoleBox.textContent =
                String(
                    error?.stack ||
                    error
                );

            status.textContent =
                "Error: " +
                String(
                    error?.message ||
                    error
                );

        } finally {

            runButton.disabled = false;
        }
    }


    /*
     * Compile & Run
     */
    runButton.addEventListener(
        "click",
        compileAndRun
    );


    /*
     * Browser errors
     */
    window.addEventListener(
        "error",
        (event) => {

            consoleBox.textContent +=
                "\n" +
                event.message;
        }
    );


    /*
     * Unhandled promise errors
     */
    window.addEventListener(
        "unhandledrejection",
        (event) => {

            consoleBox.textContent +=
                "\n" +
                String(event.reason);
        }
    );

</script>

</body>
</html>
