<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Java AWT Compiler</title>

    <!-- CheerpJ 4.3 -->
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 16px 18px;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 1px solid #30343d;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 14px 18px;
            border-bottom: 1px solid #30343d;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 13px 18px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: #2b303b;
            cursor: pointer;
        }

        button.run {
            background: #2867e8;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .container {
            padding: 15px 18px 30px;
        }

        .message {
            margin-bottom: 10px;
            color: #aeb5c4;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 55vh;
            min-height: 350px;
            resize: vertical;

            padding: 14px;

            border: none;
            border-radius: 10px;

            background: white;
            color: black;

            font-family: Consolas, "Courier New", monospace;
            font-size: 15px;
            line-height: 1.5;

            outline: none;
        }

        #status {
            margin: 12px 2px;
            min-height: 24px;
            white-space: pre-wrap;
            font-family: Consolas, "Courier New", monospace;
            color: #cbd1dc;
        }

        #output {
            margin-top: 12px;

            border: 1px solid #30343d;
            border-radius: 10px;

            background: #161922;

            min-height: 320px;
            overflow: hidden;
        }

        #console {
            padding: 12px;

            color: #dddddd;

            font-family: Consolas, "Courier New", monospace;
            white-space: pre-wrap;

            min-height: 40px;
        }

        #cheerpjDisplay {
            width: 100%;
            min-height: 250px;
        }
    </style>
</head>

<body>

<header>
    Java AWT Compiler
</header>

<div class="toolbar">
    <button id="run" class="run">▶ Compile & Run</button>
    <button id="clear">Clear</button>
    <button id="example">Insert Example</button>
    <button id="toggleOutput">Hide Output</button>
</div>

<div class="container">

    <div class="message">
        Paste your Java program below and compile it in the browser.
    </div>

    <textarea
        id="source"
        spellcheck="false"
        placeholder="Paste Java code here..."
    ></textarea>

    <div id="status">Ready.</div>

    <div id="output">
        <div id="console"></div>
        <div id="cheerpjDisplay"></div>
    </div>

</div>

<script type="module">

    const source = document.getElementById("source");
    const status = document.getElementById("status");
    const consoleBox = document.getElementById("console");
    const output = document.getElementById("output");

    const runButton = document.getElementById("run");
    const clearButton = document.getElementById("clear");
    const exampleButton = document.getElementById("example");
    const toggleOutputButton = document.getElementById("toggleOutput");

    let cheerpjReady = false;

    const exampleCode = `import java.awt.*;
import java.awt.event.*;

class HelloAWT extends Frame {

    HelloAWT() {
        setTitle("Hello AWT");
        setSize(400, 250);
        setLayout(new FlowLayout());

        add(new Label("Hello from Java AWT!"));

        setVisible(true);
    }

    public static void main(String args[]) {
        new HelloAWT();
    }
}`;

    exampleButton.addEventListener("click", () => {
        source.value = exampleCode;
        status.textContent = "Example inserted.";
    });

    clearButton.addEventListener("click", () => {
        source.value = "";
        consoleBox.textContent = "";
        status.textContent = "Ready.";
    });

    toggleOutputButton.addEventListener("click", () => {

        if (output.style.display === "none") {
            output.style.display = "block";
            toggleOutputButton.textContent = "Hide Output";
        } else {
            output.style.display = "none";
            toggleOutputButton.textContent = "Show Output";
        }
    });

    function findMainClass(code) {

        // package declaration
        const packageMatch = code.match(
            /\bpackage\s+([A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*)\s*;/
        );

        // Prefer public class
        let classMatch = code.match(
            /\bpublic\s+class\s+([A-Za-z_$][\w$]*)/
        );

        // Otherwise normal class
        if (!classMatch) {
            classMatch = code.match(
                /\bclass\s+([A-Za-z_$][\w$]*)/
            );
        }

        if (!classMatch) {
            throw new Error("No class declaration found.");
        }

        const className = classMatch[1];

        if (packageMatch) {
            return packageMatch[1] + "." + className;
        }

        return className;
    }

    async function initializeCheerpJ() {

        if (cheerpjReady) {
            return;
        }

        status.textContent = "Starting Java runtime...";

        /*
         * IMPORTANT:
         * Do NOT specify version:17 here.
         *
         * tools.jar is a Java 8 compiler.
         * CheerpJ defaults to Java 8 when version is omitted.
         */

        await cheerpjInit({
            status: "none"
        });

        cheerpjCreateDisplay(
            -1,
            -1,
            document.getElementById("cheerpjDisplay")
        );

        cheerpjReady = true;
    }

    async function compileAndRun() {

        runButton.disabled = true;

        consoleBox.textContent = "";
        status.textContent = "Starting...";

        try {

            const code = source.value.trim();

            if (!code) {
                throw new Error("The editor is empty.");
            }

            await initializeCheerpJ();

            const mainClass = findMainClass(code);

            const simpleClassName =
                mainClass.split(".").pop();

            /*
             * The source file is placed in /str/.
             */
            const sourceFile =
                "/str/" + simpleClassName + ".java";

            cheerpOSAddStringFile(
                sourceFile,
                new TextEncoder().encode(code)
            );

            /*
             * This is the same classpath structure used
             * by the current JavaFiddle implementation.
             */
            const classPath = "/app/java-compiler/tools.jar:/files/";

            status.textContent =
                "Compiling " + simpleClassName + "...";

            /*
             * Run Java compiler.
             */
            const compileResult = await cheerpjRunMain(
                "com.sun.tools.javac.Main",
                classPath,
                sourceFile,
                "-d",
                "/files/"
            );

            if (Number(compileResult) !== 0) {

                status.textContent =
                    "Compilation failed. See the output above.";

                return;
            }

            status.textContent =
                "Running " + mainClass + "...";

            /*
             * Run the compiled Java program.
             */
            const runResult = await cheerpjRunMain(
                mainClass,
                classPath
            );

            status.textContent =
                "Program finished. Exit code: " + runResult;

        } catch (error) {

            consoleBox.textContent =
                String(error?.stack || error);

            status.textContent =
                "Error: " + String(error?.message || error);

        } finally {

            runButton.disabled = false;
        }
    }

    runButton.addEventListener(
        "click",
        compileAndRun
    );

    window.addEventListener(
        "error",
        (event) => {
            consoleBox.textContent +=
                "\n" + event.message;
        }
    );

    window.addEventListener(
        "unhandledrejection",
        (event) => {
            consoleBox.textContent +=
                "\n" + String(event.reason);
        }
    );

</script>

</body>
</html>
